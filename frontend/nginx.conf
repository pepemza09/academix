server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash en el nombre: caché immutable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA con react-router: todo cae al index.html.
    location / {
        try_files $uri /index.html;
    }
}
