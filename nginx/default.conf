upstream academix_backend { server backend:8000; }
upstream academix_frontend { server frontend:80; }

server {
    listen 80;
    server_name _;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://academix_backend;
    }

    location /health/ { proxy_pass http://academix_backend; }
    location /auth/ { proxy_pass http://academix_backend; }
    location /media/ { proxy_pass http://academix_backend; }
    location / { proxy_pass http://academix_frontend; }
}
